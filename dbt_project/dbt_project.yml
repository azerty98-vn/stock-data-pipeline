name: "stock_data_pipeline"
version: "1.0.0"
config-version: 2
profile: "stock_data_pipeline"

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  stock_data_pipeline:
    staging:
      +materialized: view
    marts:
      +materialized: incremental
      +incremental_strategy: merge
