x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: orchestration/Dockerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@postgres/${AIRFLOW_DB_NAME:-airflow}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # pipeline/ (extract, load, contracts) không nằm trong dags/ nên cần
    # thêm /opt/airflow vào PYTHONPATH để `from pipeline.xxx import ...`
    # trong DAG import được.
    PYTHONPATH: /opt/airflow
    GCS_BUCKET: ${GCS_BUCKET}
    GCS_LOCATION: ${GCS_LOCATION:-asia-southeast1}
    BQ_PROJECT: ${BQ_PROJECT:-}
    BQ_DATASET: ${BQ_DATASET:-stock_pipeline}
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/keys/bq-service-account.json
  volumes:
    - ./orchestration/dags:/opt/airflow/dags
    - ./pipeline:/opt/airflow/pipeline
    - ./quality:/opt/airflow/quality
    - ./transform:/opt/airflow/transform
    - ./keys:/opt/airflow/keys:ro
    - airflow-logs:/opt/airflow/logs
    - airflow-plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname admin --lastname admin \
          --role Admin --email admin@example.com

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  metabase:
    # Kết nối BigQuery cấu hình qua UI Metabase (upload cùng service-account
    # json ở ./keys, đã mount sẵn), không qua env var — Metabase không có
    # cách khai báo datasource qua env cho BigQuery. H2 file embedded đủ
    # cho quy mô side-project, không cần thêm Postgres riêng cho Metabase.
    image: metabase/metabase:latest
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
      - ./keys:/keys:ro
    ports:
      - "3000:3000"

volumes:
  postgres-db:
  airflow-logs:
  airflow-plugins:
  metabase-data:
