name: "stock_data_pipeline"
version: "1.0.0"
config-version: 2
profile: "stock_data_pipeline"

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  stock_data_pipeline:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: incremental
      +incremental_strategy: merge

seeds:
  stock_data_pipeline:
    raw_ohlcv:
      # dbt seed auto-infer sẽ đoán `date` là STRING (BigQuery) nếu không
      # ép kiểu tường minh — ép DATE để khớp source('raw','raw_ohlcv') mà
      # staging models kỳ vọng. Seed load vào dataset của TARGET đang active
      # (xem models/staging/_sources.yml dùng target.schema) — chạy
      # `dbt seed --target ci` sẽ vào dataset CI riêng, không đụng dev/prod.
      +column_types:
        date: date
